! PHX Core Switch - Cisco Nexus 9300
! Target side - server connects here

hostname PHX-CORE-SW01

! System MTU - standard (no jumbo frames)
system mtu 1500

! Server-facing port
interface Ethernet1/1
 description TO-PHX-SRV01-eth0
 switchport mode access
 switchport access vlan 100
 speed 10000
 duplex full
 mtu 1500
 no shutdown

! Another server - NOTE: only 1G!
interface Ethernet1/2
 description TO-PHX-SRV02-eth0
 switchport mode access
 switchport access vlan 100
 speed 1000
 duplex full
 mtu 1500
 no shutdown

! Trunk to firewall
interface Ethernet1/48
 description TO-PHX-FW01-eth1/1
 switchport mode trunk
 switchport trunk allowed vlan 100,200,999
 speed 10000
 duplex full
 mtu 1500
 no shutdown

! SVIs
interface Vlan100
 description SERVER-VLAN
 ip address 10.2.100.1 255.255.255.0

interface Vlan200
 description TRANSIT-TO-FW
 ip address 10.2.200.1 255.255.255.0

! Routing
router ospf 1
 network 10.2.0.0 0.0.255.255 area 0

ip route 0.0.0.0 0.0.0.0 10.2.200.254

! Global TCP window size — too small for 10G!
ip tcp window-size 32768
