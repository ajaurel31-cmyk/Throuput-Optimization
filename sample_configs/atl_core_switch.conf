! ATL Core Switch - Cisco Catalyst 9500
! This config has intentional issues for testing the analyzer

hostname ATL-CORE-SW01

! System MTU - Note: jumbo frames enabled here
system mtu 9216

spanning-tree mode rapid-pvst

! Uplink to source server (10G)
interface TenGigabitEthernet1/0/1
 description TO-ATL-SRV01-eth0
 switchport mode access
 switchport access vlan 100
 speed 10000
 duplex full
 mtu 9216
 no shutdown

! Uplink to server 2 - NOTE: speed mismatch!
interface GigabitEthernet1/0/10
 description TO-ATL-SRV02-eth0
 switchport mode access
 switchport access vlan 100
 speed 1000
 duplex full
 no shutdown

! Trunk to firewall (10G)
interface TenGigabitEthernet1/0/48
 description TO-ATL-FW01-eth1/1
 switchport mode trunk
 switchport trunk allowed vlan 100,200,999
 speed 10000
 duplex full
 mtu 9216
 service-policy output QOS-POLICY-OUT
 no shutdown

! Management
interface Vlan100
 description SERVER-VLAN
 ip address 10.1.100.1 255.255.255.0
 ip mtu 9216

interface Vlan200
 description TRANSIT-TO-FW
 ip address 10.1.200.1 255.255.255.0
 ip mtu 9216

! QoS Policy - Note the shaper
policy-map QOS-POLICY-OUT
 class BULK-DATA
  shape average 5000000000
 class class-default
  bandwidth remaining percent 100

! Routing
router ospf 1
 network 10.1.0.0 0.0.255.255 area 0

ip route 0.0.0.0 0.0.0.0 10.1.200.254
